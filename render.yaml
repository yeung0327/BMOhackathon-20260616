services:
  - type: web
    name: roots-shoots-backend
    runtime: docker
    plan: free
    dockerfilePath: ./llm-graph-builder/backend/Dockerfile
    dockerContext: ./llm-graph-builder/backend
    healthCheckPath: /health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: LLM_MODEL_CONFIG_OPENAI_GPT_4O_MINI
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.deepseek.com/v1
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_PROVIDER
        value: sentence-transformer

  - type: web
    name: roots-shoots-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./llm-graph-builder/frontend/Dockerfile
    dockerContext: ./llm-graph-builder/frontend
    envVars:
      - key: VITE_BACKEND_API_URL
        fromService:
          name: roots-shoots-backend
          type: web
          property: host
      - key: VITE_LLM_MODELS
        value: openai_gpt_4o_mini
      - key: VITE_SKIP_AUTH
        value: "true"
